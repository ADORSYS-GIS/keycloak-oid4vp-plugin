# Theme description shown in the Admin Console theme selector.
theme.keycloak.v2+oid4vp.admin.description=Extends keycloak.v2 with the EUDI Hub configuration UI

# Sidebar entry and page title.
eudiHub=EUDI Hub

# EUDI Hub page.
eudiHubSubtitle=Configure access and registration certificates for OpenID4VC.
eudiHubAccessCertificate=Access certificate
eudiHubAccessCertificateHelp=The certificate is stored in the accessCertificate field of the OpenID4VP authenticator.
eudiHubToken=Portal access token
eudiHubTokenHelp=Paste the access token from the EUDI Hub portal. It is used only to load your organizations and request certificates, and is never stored.
eudiHubTokenGuidance=Sign in to the <portalLink>EUDI Hub portal</portalLink>, open your browser's developer tools, select a request to <apiCode>api.eudi-hub.gov.de</apiCode> in the Network tab and copy the value of its <headerCode>Authorization</headerCode> header. You may paste the copied value with the included "Bearer" prefix. The token expires after a few minutes. It is used for this request only and never stored.
eudiHubOrganization=Organization
eudiHubOrganizationHelp=Select the EUDI Hub organization to be issued the certificate. Organizations are loaded from the EUDI Hub with the portal access token.
eudiHubSelectOrganization=Select an organization
eudiHubRefreshOrganizations=Refresh organizations
eudiHubOrganizationGuidance=Organizations are loaded from the EUDI Hub after you paste a valid portal access token.
eudiHubOrganizationsLoading=Loading organizations...
eudiHubOrganizationsEmpty=No organizations are available for this token.
eudiHubOrganizationsLoadError=Could not load organizations: {{error}}
eudiHubEnvironment=Environment
eudiHubEnvironmentHelp=Select the EUDI Hub environment for which the certificate should be issued.
eudiHubEnvironment_sandbox=Sandbox
eudiHubEnvironment_live=Live
eudiHubSupportUri=Support URI
eudiHubSupportUriHelp=Select the support URI to include in the access certificate request.
eudiHubName=Certificate name
eudiHubNameHelp=Optional display name of the certificate at the EUDI Hub. Update the random placeholder as needed.
eudiHubRequestCertificate=Request certificate
eudiHubCertificateRequestError=Could not request the certificate: {{error}}
eudiHubCertificateRequestSuccess=The access certificate was requested and stored in the OpenID4VP authenticator.
eudiHubReset=Reset

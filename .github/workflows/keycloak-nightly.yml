name: Keycloak Nightly Compatibility

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/keycloak-nightly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-nightly-compatibility
  cancel-in-progress: false

jobs:
  nightly:
    name: Test against Keycloak nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build plugin against Keycloak nightly
        run: >-
          ./mvnw clean package -DskipTests --batch-mode -U
          -Dkeycloak.version=999.0.0-SNAPSHOT

      - name: Run all tests against Keycloak nightly
        run: >-
          ./mvnw test --batch-mode -U
          -Dkeycloak.version=999.0.0-SNAPSHOT
          -Dtest.keycloak.image=quay.io/keycloak/keycloak:nightly

      - name: Notify Discord on failure
        if: failure()
        uses: ./.github/actions/discord-notification
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: Keycloak nightly compatibility failed

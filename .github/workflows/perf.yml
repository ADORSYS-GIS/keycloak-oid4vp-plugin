name: Load Testing

on:
  schedule:
    # Every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      virtualUsers:
        description: 'Peak number of concurrent virtual users'
        required: false
        default: '1000'
      rampDurationSeconds:
        description: 'Duration of the ramp-up phase in seconds'
        required: false
        default: '15'
      steadyDurationSeconds:
        description: 'Duration of the steady-state phase in seconds'
        required: false
        default: '60'

permissions:
  actions: read
  contents: read

concurrency:
  group: load-testing
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for changes since the last successful scheduled run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Decide whether load tests are needed
        id: check
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const finish = async (shouldRun, reason) => {
              const decision = shouldRun ? 'run' : 'skip';
              core.setOutput('should-run', String(shouldRun));
              core.notice(`Decision: ${decision} load tests. ${reason}`);
              await core.summary
                .addHeading('Load-test decision')
                .addTable([
                  [{ data: 'Decision', header: true }, { data: 'Reason', header: true }],
                  [decision, reason],
                ])
                .write();
            };

            // A manual dispatch is an explicit request to run the tests, potentially
            // with different load parameters, so it must not be deduplicated.
            if (context.eventName === 'workflow_dispatch') {
              await finish(true, 'The workflow was started manually.');
              return;
            }

            try {
              const branch = context.ref.replace(/^refs\/heads\//, '');
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'perf.yml',
                branch,
                event: 'schedule',
                status: 'success',
                per_page: 1,
              });

              const previousRun = data.workflow_runs[0];
              if (!previousRun) {
                await finish(true, `No successful scheduled load-test run exists for ${branch}.`);
                return;
              }

              if (previousRun.head_sha !== context.sha) {
                await finish(
                  true,
                  `The commit changed from ${previousRun.head_sha} to ${context.sha}.`,
                );
                return;
              }

              await finish(
                false,
                `Commit ${context.sha} was already covered by successful scheduled run ${previousRun.id}.`,
              );
            } catch (error) {
              // Fail open: an API problem must not silently suppress load testing.
              core.warning(`Could not inspect previous workflow runs: ${error.message}`);
              await finish(true, 'Previous runs could not be inspected, so the safe fallback is to run.');
            }

  load-test:
    name: Run Gatling Simulations
    needs: check-changes
    if: >-
      !cancelled() &&
      (needs.check-changes.result != 'success' || needs.check-changes.outputs.should-run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build shaded plugin JAR
        run: ./mvnw clean package -DskipTests --batch-mode

      - name: Run all Gatling simulations
        run: |
          ./mvnw gatling:test --batch-mode \
            -Dgatling.virtualUsers=${{ inputs.virtualUsers || '1000' }} \
            -Dgatling.rampDurationSeconds=${{ inputs.rampDurationSeconds || '15' }} \
            -Dgatling.steadyDurationSeconds=${{ inputs.steadyDurationSeconds || '60' }} \
            -Dgatling.runMultipleSimulations=true

      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatling-reports
          path: target/gatling/**
          if-no-files-found: warn

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -fsSL -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Load testing failed",
                "description": "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Repository",
                    "value": "`${{ github.repository }}`",
                    "inline": true
                  },
                  {
                    "name": "Branch",
                    "value": "`${{ github.ref_name }}`",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "GitHub Actions"
                }
              }]
            }'

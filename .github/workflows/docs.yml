name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded push runs to reduce the chance of stale deployments.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci --ignore-scripts

      - name: Build docs
        working-directory: docs
        run: npm run docs:build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/site

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify commit is still latest on main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          LATEST_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')

          if [ "$CURRENT_SHA" != "$LATEST_SHA" ]; then
            echo "Skipping deployment: $CURRENT_SHA is no longer the latest commit on main ($LATEST_SHA)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Commit is up to date: $CURRENT_SHA"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

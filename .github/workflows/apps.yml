name: Admin UI

on:
  pull_request:
    paths:
      - "apps/admin-ui/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-ui:
    name: Check and build admin UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v7.1.0
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: apps/admin-ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/admin-ui
        run: pnpm install --frozen-lockfile

      - name: Check formatting and types
        working-directory: apps/admin-ui
        run: pnpm check

      - name: Build admin UI
        working-directory: apps/admin-ui
        run: pnpm build

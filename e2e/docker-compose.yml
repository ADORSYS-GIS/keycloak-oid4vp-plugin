# Isolated test stack (see .env.example for the variable defaults).
name: oid4vc-e2e

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.2}
    command: >-
      start-dev --import-realm
      --features=oid4vc-vci,oid4vc-vci-preauth-code,oid4vc-vci-rest-credential-offer
      --truststore-paths=/opt/keycloak/data/status-list-server
      --log-level=INFO,io.github.adorsysgis.keycloakstatuslist:DEBUG,io.github.adorsysgis.keycloak.protocol.oid4vc:DEBUG
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_SPI_REALM_RESTAPI_EXTENSION_OID4VP_AUTH_VERBOSE_ERRORS: "true"
      # `--truststore-paths` above merges the mounted PEM certificate into
      # Keycloak's global truststore. The OpenID4VP plugin validates status list
      # x5c chains against that truststore, and the token-status plugin trusts
      # the same PEM for its HTTPS client (status-list-tls-ca-cert-path in the
      # realm), so no JKS conversion is needed. (The older
      # `spi-truststore-file-*` settings only read JKS/PKCS12 and are deprecated.)
    ports:
      - "${KEYCLOAK_HTTP_PORT:-18080}:8080"
    depends_on:
      # The realm's status-list server must be reachable when credentials are
      # issued (the token-status plugin registers the issuer on first use).
      status-list:
        condition: service_healthy
    volumes:
      - ./build/providers/keycloak-token-status-plugin.jar:/opt/keycloak/providers/keycloak-token-status-plugin.jar:ro
      - ./build/providers/keycloak-oid4vp-plugin.jar:/opt/keycloak/providers/keycloak-oid4vp-plugin.jar:ro
      # The import file name must equal the realm name (see assets/realm/*).
      - ./build/realm.json:/opt/keycloak/data/import/oid4vc-vci-realm.json:ro
      - ./assets/crypto/keystore.p12:/opt/keycloak/data/oid4vc-vci/keystore.p12:ro
      # The status-list-server's certificate only (not the private key), merged
      # into Keycloak's global truststore via `--truststore-paths`.
      - ./assets/crypto/status-list-server/dev.crt:/opt/keycloak/data/status-list-server/dev.crt:ro
    healthcheck:
      # The Keycloak image ships no curl/wget; a plain TCP probe is enough,
      # realm readiness is awaited by scripts/play.sh before the tests.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mock-fe:
    image: ${MOCK_FE_IMAGE:-ghcr.io/adorsys-gis/keycloak-oid4vc-mock-fe:latest}
    environment:
      VITE_KEYCLOAK_URL: http://keycloak.localhost:${KEYCLOAK_HTTP_PORT:-18080}
      VITE_KEYCLOAK_REALM: oid4vc-vci
      VITE_KEYCLOAK_CLIENT_ID: oid4vc-demo-public
      VITE_OID4VC_DEFAULT_CREDENTIAL_CONFIGURATION_ID: IdentityCredential
      VITE_OID4VC_PRE_AUTHORIZED: "true"
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "${MOCK_FE_HTTP_PORT:-14200}:8080"

  wallet:
    image: ${WALLET_IMAGE:-ghcr.io/eudi-dev/eudi-dev:latest}
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    environment:
      EUDI_DEV_BASE_URL: http://localhost:${WALLET_HTTP_PORT:-18085}
      EUDI_DEV_ALLOW_PRIVATE_NETWORKS: "true"
      EUDI_DEV_LOG_FORMAT: text
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "${WALLET_HTTP_PORT:-18085}:8085"

  # Local status list server (see issue #251): the e2e journey is fully
  # self-contained and no longer depends on statuslist.eudi-adorsys.com.
  #
  # No database: the image is a postgres build, but the backend is a per-run
  # choice, and `memory` needs no database (and no `memory` feature flag).
  status-list-server:
    image: ${STATUS_LIST_SERVER_IMAGE:-ghcr.io/adorsys/status-list-server:latest-fscert}
    environment:
      APP_ENV: development
      APP_TELEMETRY__ENABLED: "false"
      # The server defaults to binding localhost; use all interfaces so the
      # TLS proxy can reach it over the compose network.
      APP_SERVER__HOST: 0.0.0.0
      APP_SERVER__PORT: "8000"
      # Signed into each status list token as
      # `https://{domain}/api/v1/status-lists/{list_id}`, so it must be the
      # URL Keycloak fetches through the TLS proxy — including the proxy port.
      # `status-list` is the proxy service name and a SAN of the certificate.
      APP_SERVER__DOMAIN: status-list:8443
      # The -fscert image loads static certificate material from these files
      # (this release has no ACME provisioning strategy switch).
      APP_SERVER__CERT__STORE__CERTIFICATE_PATH: /certs/dev.crt
      APP_SERVER__CERT__STORE__SIGNING_KEY_PATH: /certs/dev.key
      # In-memory storage: no database container is needed.
      APP_DATABASE__BACKEND: memory
      APP_CACHE__BACKEND: memory
    volumes:
      - ./assets/crypto/status-list-server/dev.crt:/certs/dev.crt:ro
      - ./assets/crypto/status-list-server/dev.key:/certs/dev.key:ro
    # The image is distroless (no shell, no HTTP client) and the binary has no
    # probe subcommand, so readiness is asserted on the TLS proxy below, which
    # reaches this service's public listener over the compose network.
    ports:
      # Debug-only plain-HTTP access from the host (no TLS, no client config
      # needed against it); the plugins use the proxy's port instead.
      - "${STATUS_LIST_SERVER_PORT:-18092}:8000"

  # TLS-terminating proxy. The published status-list-server image serves plain
  # HTTP only, while both Keycloak plugins require an HTTPS base URL. This
  # proxy terminates TLS for them and forwards to the server's single listener.
  # It is also the readiness gate of the pair (see its healthcheck).
  status-list:
    image: nginx:1.27-alpine
    volumes:
      - ./assets/crypto/status-list-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets/crypto/status-list-server/dev.crt:/certs/dev.crt:ro
      - ./assets/crypto/status-list-server/dev.key:/certs/dev.key:ro
    depends_on:
      status-list-server:
        condition: service_started
    healthcheck:
      # Proves the proxy answers over TLS, and with it that the status list
      # server behind it is up (503/500 until then). Use 127.0.0.1: nginx
      # listens on IPv4 only, while `localhost` resolves to ::1 first.
      test:
        ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8443/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "${STATUS_LIST_HTTP_PORT:-18091}:8443"

# TLS-terminating proxy for the local status-list-server.
#
# The status-list-server serves plain HTTP only, while the Keycloak plugins
# require an HTTPS base URL for the status list. This proxy terminates TLS for
# them and forwards everything to the server's public listener.
#
# `status-list` is the compose service name, a SAN of the certificate and the
# host Keycloak uses (see APP_SERVER__DOMAIN and assets/realm/config.ts).

server {
    # Both families: a host's `localhost` may resolve to ::1 first.
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name status-list;

    ssl_certificate     /certs/dev.crt;
    ssl_certificate_key /certs/dev.key;

    location / {
        proxy_pass http://status-list-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

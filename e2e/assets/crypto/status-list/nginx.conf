# TLS-terminating proxy for the local status-list-server.
#
# The status-list-server itself serves plain HTTP on two listeners (public
# reads on :8000, authenticated management writes on :8001), but the OpenID4VP
# and token-status plugins require an HTTPS base URL and reach both listener
# kinds through a single `status-list-server-url`. This proxy terminates TLS
# and routes each request to the right listener.
#
# All addresses are compose service names inside the oid4vc-e2e network.

server {
    listen 8443 ssl;
    server_name status-list;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    # Management (authenticated issuer) endpoints -> server :8001
    location ~ ^/api/v1/status-lists/[^/]+/statuses/?$ {
        proxy_pass http://status-list-server:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/api/v1/status-lists/[^/]+/allocations$ {
        proxy_pass http://status-list-server:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/v1/credentials {
        proxy_pass http://status-list-server:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else (public reads, health, service document) -> server :8000
    location / {
        proxy_pass http://status-list-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

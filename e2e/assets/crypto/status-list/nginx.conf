# TLS-terminating proxy for the local status-list-server.
#
# The status-list-server (the published `latest-fscert` image) serves plain
# HTTP only, while both Keycloak plugins require an HTTPS base URL. This proxy
# terminates TLS for them and forwards everything to the server's single
# listener.
#
# `status-list` is the compose service name; it is also the name the proxy's
# certificate is issued for, so TLS hostname verification succeeds from inside
# the compose network.

server {
    listen 8443 ssl;
    server_name status-list;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    location / {
        proxy_pass http://status-list-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
